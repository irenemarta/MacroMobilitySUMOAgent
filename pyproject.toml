[project]
name = "project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.3.1",
    "colorama>=0.4.6",
    "contextily>=1.7.0",
    "dotenv>=0.9.9",
    "geopandas>=1.1.2",
    "geopy>=2.4.1",
    "ipykernel>=7.1.0",
    "matplotlib>=3.10.8",
    "networkx>=3.6.1",
    "pandas>=2.3.3",
    "pandera>=0.29.0",
    "pymssql>=2.3.11",
    "pyproj>=3.7.2",
    "pyyaml>=6.0.3",
    "requests>=2.32.5",
    "seaborn>=0.13.2",
    "shapely>=2.1.2",
    "sqlalchemy>=2.0.46",
    "sumolib>=1.25.0",
    "tqdm>=4.70.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["scripts/tests"]
